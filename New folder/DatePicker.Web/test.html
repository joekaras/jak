<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DateTimePicker Test Suite</title>
    <link rel="stylesheet" href="Content/bootstrap.min.css">
    <link rel="stylesheet" href="Content/bootstrap-datetimepicker.css">
</head>
<body>
    <div id="test-container" style="display:none;"></div>
    <div id="results" style="padding:20px; font-family: monospace;"></div>

    <script src="Scripts/jquery-3.7.1.min.js"></script>
    <script src="Scripts/bootstrap-datetimepicker.js"></script>
    <script>
        window.testResults = [];
        var container = document.getElementById('test-container');

        function assert(condition, message) {
            if (condition) {
                window.testResults.push({ name: message, status: 'PASS' });
            } else {
                window.testResults.push({ name: message, status: 'FAIL' });
            }
        }

        function runTests() {
            try {
                // Test 1: Global definitions
                assert(typeof DateTimePicker === 'function', 'DateTimePicker global constructor exists');
                assert(typeof DatePicker === 'function', 'DatePicker global alias exists');
                assert(typeof $.fn.datetimepicker === 'function', '$.fn.datetimepicker plugin exists');
                assert(typeof $.fn.datepicker === 'function', '$.fn.datepicker plugin exists');

                // Test 2: Basic jQuery initialization
                var $input = $('<input type="text">').appendTo(container);
                $input.datetimepicker({ format: 'YYYY-MM-DD' });
                var instance = $input.data('DateTimePicker');
                assert(instance !== undefined, 'DateTimePicker instance attached to element data');

                // Test 3: Set date and format
                instance.date('2026-09-29');
                assert($input.val() === '2026-09-29', 'Date set correctly to 2026-09-29');
                var d = instance.date();
                assert(d !== null, 'instance.date() returns non-null date');
                assert(d.getFullYear() === 2026 && d.getMonth() === 8 && d.getDate() === 29, 'Date parsed parts are correct (2026-09-29)');

                // Test 4: Custom format (MM/DD/YYYY)
                var $input2 = $('<input type="text">').appendTo(container);
                $input2.datetimepicker({ format: 'MM/DD/YYYY' });
                $input2.data('DateTimePicker').date('2026-09-29');
                assert($input2.val() === '09/29/2026', 'Custom format MM/DD/YYYY formatted properly');

                // Test 5: European Custom format (DD/MM/YYYY) - no swap bug
                var $inputEu = $('<input type="text">').appendTo(container);
                $inputEu.datetimepicker({ format: 'DD/MM/YYYY' });
                $inputEu.data('DateTimePicker').date('25/12/2026');
                assert($inputEu.val() === '25/12/2026', 'European DD/MM/YYYY parsed and formatted properly');
                var euDate = $inputEu.data('DateTimePicker').date();
                assert(euDate.getDate() === 25 && euDate.getMonth() === 11 && euDate.getFullYear() === 2026, 'European 25/12/2026 parts correct (Dec 25 2026)');

                // Test 6: Dashed & dotted custom formats (DD-MM-YYYY, DD.MM.YYYY)
                var $inputDash = $('<input type="text">').appendTo(container);
                $inputDash.datetimepicker({ format: 'DD-MM-YYYY' });
                $inputDash.data('DateTimePicker').date('15-10-2026');
                assert($inputDash.val() === '15-10-2026', 'Dashed DD-MM-YYYY parsed correctly');

                var $inputDot = $('<input type="text">').appendTo(container);
                $inputDot.datetimepicker({ format: 'DD.MM.YYYY' });
                $inputDot.data('DateTimePicker').date('05.11.2026');
                assert($inputDot.val() === '05.11.2026', 'Dotted DD.MM.YYYY parsed correctly');

                // Test 7: Time-only 24-hr picker (HH:mm)
                var $inputTime24 = $('<input type="text">').appendTo(container);
                $inputTime24.datetimepicker({ format: 'HH:mm' });
                $inputTime24.data('DateTimePicker').date('14:30');
                assert($inputTime24.val() === '14:30', 'Time-only 24-hour HH:mm parsed and formatted (14:30)');
                var tDate24 = $inputTime24.data('DateTimePicker').date();
                assert(tDate24.getHours() === 14 && tDate24.getMinutes() === 30, 'Time-only 24-hr parts correct');

                // Test 8: Time-only 12-hr picker (hh:mm A)
                var $inputTime12 = $('<input type="text">').appendTo(container);
                $inputTime12.datetimepicker({ format: 'hh:mm A' });
                $inputTime12.data('DateTimePicker').date('02:45 PM');
                assert($inputTime12.val() === '02:45 PM', 'Time-only 12-hour hh:mm A parsed and formatted (02:45 PM)');
                var tDate12 = $inputTime12.data('DateTimePicker').date();
                assert(tDate12.getHours() === 14 && tDate12.getMinutes() === 45, 'Time-only 12-hr parts correct');

                // Test 9: Bracket literal formatting (e.g. [Date:] DD/MM/YYYY)
                var $inputBracket = $('<input type="text">').appendTo(container);
                $inputBracket.datetimepicker({ format: '[Date:] DD/MM/YYYY' });
                $inputBracket.data('DateTimePicker').date(new Date(2026, 8, 29));
                assert($inputBracket.val() === 'Date: 29/09/2026', 'Bracket literal escaping preserved without corrupting format');

                // Test 10: dp.change event firing
                var changeFired = false;
                var eventDate = null;
                $input2.on('dp.change', function(e) {
                    changeFired = true;
                    eventDate = e.date;
                });
                $input2.data('DateTimePicker').date('2026-10-15');
                assert(changeFired === true, 'dp.change event was fired on date change');
                assert($input2.val() === '10/15/2026', 'Date updated after change');

                // Test 11: dp.show and dp.hide events
                var showFired = false;
                var hideFired = false;
                $input2.on('dp.show', function() { showFired = true; });
                $input2.on('dp.hide', function() { hideFired = true; });
                $input2.data('DateTimePicker').show();
                assert(showFired === true, 'dp.show event fired when show() called');
                $input2.data('DateTimePicker').hide();
                assert(hideFired === true, 'dp.hide event fired when hide() called');

                // Test 12: Clear method
                $input2.data('DateTimePicker').clear();
                assert($input2.val() === '', 'clear() empties the input value');
                assert($input2.data('DateTimePicker').date() === null, 'instance.date() returns null after clear()');

                // Test 13: Min and Max Date constraints
                var $input3 = $('<input type="text">').appendTo(container);
                $input3.datetimepicker({
                    format: 'YYYY-MM-DD',
                    minDate: '2026-09-10',
                    maxDate: '2026-09-20'
                });
                var inst3 = $input3.data('DateTimePicker');
                inst3.date('2026-09-01'); // Before minDate
                assert($input3.val() !== '2026-09-01', 'minDate constraint prevented setting invalid date');
                inst3.date('2026-09-15'); // Valid date
                assert($input3.val() === '2026-09-15', 'Valid date within min/max constraint was set');
                inst3.date('2026-09-25'); // After maxDate
                assert($input3.val() === '2026-09-15', 'maxDate constraint prevented setting invalid date');

                // Test 14: Days of week disabled
                var $input4 = $('<input type="text">').appendTo(container);
                $input4.datetimepicker({
                    format: 'YYYY-MM-DD',
                    daysOfWeekDisabled: [0, 6] // Disable Sun, Sat
                });
                var inst4 = $input4.data('DateTimePicker');
                // 2026-09-26 is a Saturday
                inst4.date('2026-09-26');
                assert($input4.val() !== '2026-09-26', 'daysOfWeekDisabled prevented setting Saturday');
                // 2026-09-28 is a Monday
                inst4.date('2026-09-28');
                assert($input4.val() === '2026-09-28', 'daysOfWeekDisabled allowed setting Monday');

                // Test 15: Time picker (increment/decrement/stepping)
                var $input5 = $('<input type="text">').appendTo(container);
                $input5.datetimepicker({
                    format: 'YYYY-MM-DD HH:mm',
                    stepping: 15
                });
                var inst5 = $input5.data('DateTimePicker');
                inst5.date('2026-09-29 10:00');
                assert($input5.val() === '2026-09-29 10:00', 'DateTime picker set value 2026-09-29 10:00');

                // Test 16: Vanilla JS instantiation
                var vanillaDiv = document.createElement('div');
                var vanillaInput = document.createElement('input');
                vanillaDiv.appendChild(vanillaInput);
                container.appendChild(vanillaDiv);
                var vInstance = new DateTimePicker(vanillaDiv, { format: 'YYYY-MM-DD' });
                assert(typeof vInstance.date === 'function', 'Vanilla DateTimePicker created successfully');
                vInstance.date('2026-11-20');
                assert(vanillaInput.value === '2026-11-20', 'Vanilla DateTimePicker set value to 2026-11-20');

                // Test 17: Inline picker
                var inlineDiv = document.createElement('div');
                container.appendChild(inlineDiv);
                var inlineInst = new DateTimePicker(inlineDiv, { inline: true, format: 'YYYY-MM-DD' });
                var inlineWidget = inlineDiv.querySelector('.bootstrap-datetimepicker-widget');
                assert(inlineWidget !== null, 'Inline picker renders widget DOM inside element');

                // Test 18: Destroy method
                $input.datetimepicker('destroy');
                assert($input.data('DateTimePicker') === undefined, 'destroy() successfully cleaned up instance');

                // Test 19: Month rollover bug check (Day 31 switching to February)
                var $rolloverInput = $('<input type="text">').appendTo(container);
                $rolloverInput.datetimepicker({ format: 'YYYY-MM-DD', inline: true });
                var rInst = $rolloverInput.data('DateTimePicker');
                // Set initial date to March 31
                rInst.date('2026-03-31');
                // Select February 15 by clicking day
                var rWidget = $rolloverInput.find('.bootstrap-datetimepicker-widget')[0];
                var febCell = document.createElement('td');
                febCell.setAttribute('data-action', 'selectDay');
                febCell.setAttribute('data-day', '2026-02-15');
                rWidget.appendChild(febCell);
                febCell.click();
                assert($rolloverInput.val() === '2026-02-15', 'Month rollover avoided: selecting Feb 15 from March 31 sets 2026-02-15');

                // Test 20: dp.error event on invalid date
                var errorFired = false;
                $rolloverInput.on('dp.error', function() { errorFired = true; });
                rInst.date('invalid-date-string-xyz');
                assert(errorFired === true, 'dp.error fired when invalid date provided');

                // Helpers for the regression tests below
                function fire(elem, type) { elem.dispatchEvent(new Event(type, { bubbles: true })); }
                function act(widget, action, attrs) {
                    var cell = document.createElement('td');
                    cell.setAttribute('data-action', action);
                    Object.keys(attrs || {}).forEach(function (k) { cell.setAttribute(k, attrs[k]); });
                    widget.appendChild(cell);
                    cell.click();
                }
                function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
                function widgetCount() { return document.querySelectorAll('.bootstrap-datetimepicker-widget').length; }

                // Test 21: dp.change fires exactly once per change (input change listener round-trip)
                var $once = $('<input type="text">').appendTo(container);
                $once.datetimepicker({ format: 'YYYY-MM-DD' });
                var changeCount = 0;
                $once.on('dp.change', function () { changeCount++; });
                $once.data('DateTimePicker').date('2026-09-29');
                assert(changeCount === 1, 'dp.change fires once per date() call (got ' + changeCount + ')');
                changeCount = 0;
                $once.data('DateTimePicker').date('2026-09-29');
                assert(changeCount === 0, 'dp.change does not fire when the date is unchanged');

                // Test 22: destroy() unbinds input listeners
                var destroyInput = document.createElement('input');
                container.appendChild(destroyInput);
                new DateTimePicker(destroyInput, { format: 'YYYY-MM-DD' }).destroy();
                var before = widgetCount();
                fire(destroyInput, 'focus');
                assert(widgetCount() === before, 'focus after destroy() does not recreate the widget');

                // Test 23: Today button works when maxDate is today (date-only strips time)
                var todayStr = ymd(new Date());
                var todayDiv = document.createElement('div');
                container.appendChild(todayDiv);
                todayDiv.appendChild(document.createElement('input'));
                var todayInst = new DateTimePicker(todayDiv, { inline: true, format: 'YYYY-MM-DD', minDate: todayStr, maxDate: todayStr, useCurrent: false });
                act(todayDiv.querySelector('.bootstrap-datetimepicker-widget'), 'today');
                assert(todayDiv.querySelector('input').value === todayStr, 'Today button succeeds when maxDate is today');

                // Test 24: datetime selectDay on the maxDate day clamps the time
                var clampDiv = document.createElement('div');
                container.appendChild(clampDiv);
                clampDiv.appendChild(document.createElement('input'));
                var clampInst = new DateTimePicker(clampDiv, { inline: true, format: 'YYYY-MM-DD HH:mm', maxDate: '2026-09-20 08:00' });
                clampInst.date('2026-09-19 10:00');
                act(clampDiv.querySelector('.bootstrap-datetimepicker-widget'), 'selectDay', { 'data-day': '2026-09-20' });
                assert(clampDiv.querySelector('input').value === '2026-09-20 08:00', 'selectDay on maxDate day clamps time to maxDate (got ' + clampDiv.querySelector('input').value + ')');

                // Test 25: garbage typed into the input fires dp.error, not a Date.parse guess
                var $garbage = $('<input type="text">').appendTo(container);
                $garbage.datetimepicker({ format: 'YYYY-MM-DD' });
                var garbageError = false;
                $garbage.on('dp.error', function () { garbageError = true; });
                $garbage.val('1');
                fire($garbage[0], 'change');
                assert(garbageError && $garbage.data('DateTimePicker').date() === null, 'Typing "1" fires dp.error and leaves date null');

                // Test 26: bracket literals don't affect date/time detection
                var litDiv = document.createElement('div');
                container.appendChild(litDiv);
                litDiv.appendChild(document.createElement('input'));
                new DateTimePicker(litDiv, { inline: true, format: '[Date:] HH:mm' });
                var litWidget = litDiv.querySelector('.bootstrap-datetimepicker-widget');
                assert(!litWidget.querySelector('.datepicker-days') && litWidget.querySelector('.timepicker'), '[Date:] HH:mm renders the time view only');

                // Test 27: YY pivot
                var $yy = $('<input type="text">').appendTo(container);
                $yy.datetimepicker({ format: 'DD/MM/YY' });
                $yy.data('DateTimePicker').date('01/02/99');
                var yyDate = $yy.data('DateTimePicker').date();
                assert(yyDate && yyDate.getFullYear() === 1999, 'YY=99 parses as 1999');
                $yy.data('DateTimePicker').date('01/02/26');
                assert($yy.data('DateTimePicker').date().getFullYear() === 2026, 'YY=26 parses as 2026');

                // Test 28: allowInputToggle — focus then click leaves the picker open
                var togDiv = document.createElement('div');
                togDiv.className = 'input-group';
                container.appendChild(togDiv);
                var togInput = document.createElement('input');
                togDiv.appendChild(togInput);
                var shown = 0, hidden = 0;
                togDiv.addEventListener('dp.show', function () { shown++; });
                togDiv.addEventListener('dp.hide', function () { hidden++; });
                var togInst = new DateTimePicker(togDiv, { format: 'YYYY-MM-DD', allowInputToggle: true, useCurrent: false });
                fire(togInput, 'focus');
                fire(togInput, 'click');
                assert(shown === 1 && hidden === 0, 'allowInputToggle: focus+click opens once and stays open');
                togInst.hide();

                // Test 29: input-group without allowInputToggle doesn't open on input focus (legacy behaviour)
                var grpDiv = document.createElement('div');
                grpDiv.className = 'input-group';
                container.appendChild(grpDiv);
                var grpInput = document.createElement('input');
                grpDiv.appendChild(grpInput);
                var grpShown = 0;
                grpDiv.addEventListener('dp.show', function () { grpShown++; });
                new DateTimePicker(grpDiv, { format: 'YYYY-MM-DD' });
                fire(grpInput, 'focus');
                assert(grpShown === 0, 'input-group without allowInputToggle does not open on input focus');

                // Test 30: minute grid honours stepping; seconds display has no dead action
                var stepDiv = document.createElement('div');
                container.appendChild(stepDiv);
                stepDiv.appendChild(document.createElement('input'));
                new DateTimePicker(stepDiv, { inline: true, format: 'HH:mm:ss', stepping: 15 });
                var stepWidget = stepDiv.querySelector('.bootstrap-datetimepicker-widget');
                assert(!stepWidget.querySelector('[data-action="showSeconds"]'), 'Seconds display has no unhandled showSeconds action');
                act(stepWidget, 'showMinutes');
                var minuteCells = stepWidget.querySelectorAll('[data-action="selectMinute"]');
                assert(minuteCells.length === 4, 'Minute grid with stepping 15 has 4 cells (got ' + minuteCells.length + ')');

                // Test 31: useCurrent
                var ucInput = document.createElement('input');
                container.appendChild(ucInput);
                var ucInst = new DateTimePicker(ucInput, { format: 'YYYY-MM-DD' });
                ucInst.show();
                assert(ucInput.value === todayStr, 'useCurrent (default) fills today on show');
                ucInst.hide();
                var ucOffInput = document.createElement('input');
                container.appendChild(ucOffInput);
                var ucOff = new DateTimePicker(ucOffInput, { format: 'YYYY-MM-DD', useCurrent: false });
                ucOff.show();
                assert(ucOff.date() === null, 'useCurrent:false leaves the value empty on show');
                ucOff.hide();

                // Test 32: e.date is always a native Date
                var nativeDate = null;
                $once.on('dp.change', function (e) { nativeDate = e.date; });
                $once.data('DateTimePicker').date('2026-10-01');
                assert(nativeDate instanceof Date, 'dp.change e.date is a native Date');

                // Test 33: keyboard navigation while open
                var kbInput = document.createElement('input');
                container.appendChild(kbInput);
                var kbInst = new DateTimePicker(kbInput, { format: 'YYYY-MM-DD' });
                kbInst.date('2026-09-29');
                function key(k) { kbInput.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true })); }
                key('ArrowRight');
                assert(kbInput.value === '2026-09-29', 'Arrow keys do nothing while the picker is closed');
                kbInst.show();
                key('ArrowRight');
                assert(kbInput.value === '2026-09-30', 'ArrowRight moves +1 day (got ' + kbInput.value + ')');
                key('ArrowDown');
                assert(kbInput.value === '2026-10-07', 'ArrowDown moves +7 days (got ' + kbInput.value + ')');
                key('ArrowLeft');
                assert(kbInput.value === '2026-10-06', 'ArrowLeft moves -1 day (got ' + kbInput.value + ')');
                key('ArrowUp');
                assert(kbInput.value === '2026-09-29', 'ArrowUp moves -7 days (got ' + kbInput.value + ')');
                key('PageDown');
                assert(kbInput.value === '2026-10-29', 'PageDown moves +1 month (got ' + kbInput.value + ')');
                key('PageUp');
                key('PageUp');
                assert(kbInput.value === '2026-08-29', 'PageUp moves -1 month (got ' + kbInput.value + ')');
                kbInst.date('2026-09-29');
                kbInst.date('2026-01-31');
                key('PageDown');
                assert(kbInput.value === '2026-02-28', 'PageDown from Jan 31 clamps to Feb 28 (got ' + kbInput.value + ')');
                kbInst.hide();

                // Test 34: input text is resynced even when the instant is unchanged
                var $fmt = $('<input type="text">').appendTo(container);
                $fmt.datetimepicker({ format: 'YYYY-MM-DD' });
                var fmtInst = $fmt.data('DateTimePicker');
                fmtInst.date('2026-09-29');
                var fmtChanges = 0;
                $fmt.on('dp.change', function () { fmtChanges++; });
                fmtInst.format('DD/MM/YYYY');
                assert($fmt.val() === '29/09/2026', 'format() rewrites the input text (got ' + $fmt.val() + ')');
                $fmt.val('29/9/2026');
                fire($fmt[0], 'change');
                assert($fmt.val() === '29/09/2026', 'Typed unpadded date is normalised (got ' + $fmt.val() + ')');
                assert(fmtChanges === 0, 'Neither resync fired dp.change (got ' + fmtChanges + ')');

                // Test 35: seconds column follows the expanded, literal-stripped format
                function secondsColumn(fmt) {
                    var div = document.createElement('div');
                    container.appendChild(div);
                    div.appendChild(document.createElement('input'));
                    new DateTimePicker(div, { inline: true, format: fmt });
                    return !!div.querySelector('.timepicker-second');
                }
                assert(secondsColumn('LTS') === true, 'LTS shows the seconds column');
                assert(secondsColumn('[Time is] HH:mm') === false, '"s" inside a [literal] does not add a seconds column');

                // Test 36: tooltip and icon-class strings are HTML-escaped in the widget
                var xssDiv = document.createElement('div');
                container.appendChild(xssDiv);
                xssDiv.appendChild(document.createElement('input'));
                new DateTimePicker(xssDiv, {
                    inline: true, format: 'YYYY-MM-DD', showTodayButton: true,
                    tooltips: { today: '"><img src=x onerror="window.__xss=1">' },
                    icons: { today: 'x"><img src=x onerror="window.__xss=1">' }
                });
                var xssWidget = xssDiv.querySelector('.bootstrap-datetimepicker-widget');
                assert(!xssWidget.querySelector('img') && !window.__xss, 'Tooltip and icon strings cannot inject elements');
                assert(xssWidget.querySelector('[data-action="today"]').getAttribute('title') === '"><img src=x onerror="window.__xss=1">', 'Escaped tooltip round-trips as plain text');

                window.testsDone = true;
            } catch (err) {
                window.testResults.push({ name: 'Exception: ' + err.message + '\n' + err.stack, status: 'ERROR' });
                window.testsDone = true;
            }

            // Display results on screen
            var resDiv = document.getElementById('results');
            var passCount = 0;
            var failCount = 0;
            resDiv.textContent = '';
            window.testResults.forEach(function(r) {
                if (r.status === 'PASS') passCount++;
                else failCount++;
                var line = document.createElement('div');
                line.style.color = r.status === 'PASS' ? 'green' : 'red';
                line.textContent = '[' + r.status + '] ' + r.name;
                resDiv.appendChild(line);
            });
            resDiv.appendChild(document.createElement('hr'));
            var summary = document.createElement('h3');
            summary.textContent = 'Summary: ' + passCount + ' passed, ' + failCount + ' failed';
            resDiv.appendChild(summary);
        }

        // Run immediately so DOM is populated for headless dump-dom and automated runners
        runTests();
    </script>
</body>
</html>

# Azure DevOps deployment job that delivers a wrapped, single-use secret_id to a Windows app server and
# restarts the service. Illustrative; adapt the environment, role, and how the job authenticates to Vault.
#
# The job runs on the target server (environment VM resource) and logs in to Vault with its own identity
# (workload identity/JWT preferred), whose policy is deploy/policy-deliverer.hcl.

jobs:
  - deployment: DeliverSecretId
    environment:
      name: REPLACE-environment
      resourceType: VirtualMachine
    strategy:
      runOnce:
        deploy:
          steps:
            - powershell: |
                $ErrorActionPreference = 'Stop'
                $dir  = 'C:\apps\vault-poc\secrets'
                $file = Join-Path $dir 'wrapped-secret-id'

                $wrapped = vault write -wrap-ttl=10m -field=wrapping_token -f "auth/approle/role/$(VaultRole)/secret-id"
                if (-not $wrapped -or $wrapped -eq 'null') { throw 'Vault did not return a wrapping token' }

                New-Item -ItemType Directory -Force $dir | Out-Null
                # Only the service account and SYSTEM may read the folder; inheritance removed.
                icacls $dir /inheritance:r /grant:r "NT SERVICE\vault-poc-java:(OI)(CI)F" "SYSTEM:(OI)(CI)F" | Out-Null
                [IO.File]::WriteAllText($file, $wrapped)
                Remove-Variable wrapped

                Restart-Service vault-poc-java
              displayName: Deliver wrapped secret_id and restart service
